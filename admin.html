<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin dashboard | TechIndustries</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nameplate">
    <div class="container">
        <a href="index.html" class="brand">
            <span class="brand-mark">TI</span>
            <span class="brand-name">TechIndustries<span>Tech support &amp; web solutions</span></span>
        </a>
        <div class="nav-auth">
            <span id="whoami" style="color:#B9C2CE; font-size:.88rem;"></span>
            <button class="btn-nav" id="signOutBtn" type="button">Sign out</button>
        </div>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <h1>Enquiries</h1>
        <p>Newest first. Only visible to signed-in admins.</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="ledger-wrap">
            <table class="ledger-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Service</th>
                        <th>Message</th>
                        <th>Received</th>
                    </tr>
                </thead>
                <tbody id="enquiriesBody"></tbody>
            </table>
            <p class="empty-state" id="emptyState">No enquiries yet.</p>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <div><strong>TechIndustries</strong> — tech support &amp; web solutions</div>
        <div>© 2026 TechIndustries. All rights reserved. · Powered by Codeharbour</div>
    </div>
</footer>

<script src="supabase-config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
