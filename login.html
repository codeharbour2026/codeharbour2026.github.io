<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin sign in | TechIndustries</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nameplate">
    <div class="container">
        <a href="index.html" class="brand">
            <span class="brand-mark">TI</span>
            <span class="brand-name">TechIndustries<span>Tech support &amp; web solutions</span></span>
        </a>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <h1>Admin sign in</h1>
        <p>Staff only — this is not a customer account.</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <form id="loginForm" class="intake" style="max-width:420px;" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit">Sign in</button>
            <div class="form-status err" id="loginError" role="alert">Sign-in failed — check your email and password.</div>
        </form>
        <p style="margin-top:24px; font-size:.9rem; color:var(--ink-soft);">
            <a href="index.html" style="color:var(--teal); font-weight:600;">← Back to the site</a>
        </p>
    </div>
</section>

<footer>
    <div class="container">
        <div><strong>TechIndustries</strong> — tech support &amp; web solutions</div>
        <div>© 2026 TechIndustries. All rights reserved. · Powered by Codeharbour</div>
    </div>
</footer>

<script src="supabase-config.js"></script>
<script type="module" src="login.js"></script>
</body>
</html>
