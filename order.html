<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order | TechIndustries</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nameplate">
    <div class="container">
        <a href="index.html" class="brand">
            <span class="brand-mark">TI</span>
            <span class="brand-name">TechIndustries<span>Tech support &amp; web solutions</span></span>
        </a>
        <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="nav-auth" id="navAuth"></div>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <p style="margin-bottom:10px;"><a href="account.html" style="color:#B9C2CE; font-size:.9rem;">← Back to my account</a></p>
        <h1 id="orderTitle">Order</h1>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="order-detail-head">
            <span class="status-pill" id="orderStatus"></span>
            <span id="orderMeta" style="color:var(--ink-soft); font-size:.92rem;"></span>
        </div>
        <p id="orderNotes" style="margin-bottom:28px;"></p>

        <h2 class="section-subhead" style="margin-top:0;">Messages</h2>
        <div class="chat-wrap">
            <div class="chat-messages" id="chatMessages"></div>
            <form class="chat-form" id="chatForm">
                <textarea id="chatInput" placeholder="Write a message…" required></textarea>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <div><strong>TechIndustries</strong> — tech support &amp; web solutions</div>
        <div>© 2026 TechIndustries. All rights reserved. · Powered by Codeharbour · <a href="login.html" style="color:#5a6377;">Admin</a></div>
    </div>
</footer>

<script src="supabase-config.js"></script>
<script type="module" src="order.js"></script>

</body>
</html>
