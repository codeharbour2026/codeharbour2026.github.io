<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up | Codeharbour</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nameplate">
    <div class="container">
        <a href="index.html" class="brand">
            <span class="brand-mark">CH</span>
            <span class="brand-name">Codeharbour<span>One account, two products</span></span>
        </a>
        <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
        </ul>
        <div class="nav-auth">
            <a class="btn-nav" href="signin.html">Sign in</a>
            <a class="btn-nav filled" href="signup.html" aria-current="page">Sign up</a>
        </div>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <h1>Create an account</h1>
        <p>One account for both TechIndustries and CodeHarbour Tools.</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <form id="signupForm" class="intake" style="max-width:420px;" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
            </div>
            <button type="submit">Create account</button>
            <div class="form-status err" id="signupError" role="alert"></div>
            <div class="form-status ok" id="signupStatus" role="status"></div>
        </form>
        <p style="margin-top:24px; font-size:.9rem; color:var(--ink-soft);">
            Already have an account? <a href="signin.html" style="color:var(--teal); font-weight:600;">Sign in</a>
        </p>
    </div>
</section>

<footer>
    <div class="container">
        <div><strong>Codeharbour</strong> — the account layer behind TechIndustries &amp; CodeHarbour Tools.</div>
        <div>© 2026 Codeharbour.</div>
    </div>
</footer>

<script src="supabase-config.js"></script>
<script type="module" src="signup.js"></script>
</body>
</html>
